datasets:
  - name: train_v1
    path: /dataset
    type: folder

configs:
  - name: default
    epochs: 200
    learning_rate: 0.001
    batch_size: 16
    weight_decay: 0.0001
    optimizer: adamw
    scheduler: cosine
    warmup_epochs: 5
    gradient_clip: 1.0
    mixed_precision: true
    early_stopping_patience: 10
