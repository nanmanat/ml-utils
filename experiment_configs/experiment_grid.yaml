# Example Grid Search Experiment Configuration
# Use with: mlcli> experiment my_grid_exp --config configs/experiment_grid.yaml

name: grid_search_experiment
description: "Compare multiple models, datasets, and training configurations"
seed: 42

# Define multiple models to compare
models:
  - name: resnet_small
    architecture: resnet18
    num_classes: 4
    pretrained: true
  
  - name: resnet_large
    architecture: resnet50
    num_classes: 4
    pretrained: true

# Define multiple datasets to use
datasets:
  - name: train_v1
    path: /Users/nanmanatvaristhanist/Downloads/ACNE04
    type: folder

# Define multiple training configurations
configs:
  - name: fast
    epochs: 2
    learning_rate: 0.01
    batch_size: 64
    optimizer: adamw
    scheduler: cosine
    mixed_precision: false

